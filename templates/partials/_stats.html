<!-- Stats Section -->
<section class="py-0">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <div class="stats-grid grid grid-cols-2 lg:grid-cols-4">

            <!-- Stat 1 -->
            <div class="stat-item reveal">
                <div class="stat-number">
                    <span data-count="350" data-suffix="+">0</span>
                    <span class="suffix">+</span>
                </div>
                <p class="stat-label">Proyectos completados</p>
            </div>

            <!-- Stat 2 -->
            <div class="stat-item reveal delay-100">
                <div class="stat-number">
                    <span data-count="20" data-suffix="">0</span>
                    <span class="suffix">+</span>
                </div>
                <p class="stat-label">Años de experiencia</p>
            </div>

            <!-- Stat 3 -->
            <div class="stat-item reveal delay-200">
                <div class="stat-number">
                    <span data-count="85" data-suffix="">0</span>
                    <span class="suffix">K</span>
                </div>
                <p class="stat-label">m² construidos</p>
            </div>

            <!-- Stat 4 -->
            <div class="stat-item reveal delay-300">
                <div class="stat-number">
                    <span data-count="98" data-suffix="">0</span>
                    <span class="suffix">%</span>
                </div>
                <p class="stat-label">Clientes satisfechos</p>
            </div>

        </div>
    </div>
</section>
